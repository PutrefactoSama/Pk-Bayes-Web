<script>
  const tl = gsap.timeline({ paused: true });

  const cMM = document.getElementById("curve-mm");
  const lMM = cMM ? cMM.getTotalLength() : 400;
  if (cMM) {
    cMM.style.strokeDasharray = lMM;
    cMM.style.strokeDashoffset = lMM;
  }

  // Pacing to voiceover (total 10.816s)
  tl.from("#h1-title-5", { opacity: 0, y: -20, duration: 0.8, ease: "power2.out" }, 0.2)
    .from("#p-sub-5", { opacity: 0, y: -10, duration: 0.8, ease: "power2.out" }, 0.5)

    // Bento cards stagger in

    .from("#bento-2", { opacity: 0, y: 30, duration: 0.8, ease: "power2.out" }, 2.4)
    .from("#bento-3", { opacity: 0, y: 30, duration: 0.8, ease: "power2.out" }, 3.8)

    // Draw Michaelis Menten curve
    .to(cMM, { strokeDashoffset: 0, duration: 2.2, ease: "power1.inOut" }, 2.0)

    // Pulse Sheiner Tozer box
    .from("#st-box", { scale: 0.95, opacity: 0, duration: 0.6, ease: "back.out(2)" }, 4.5)
    .to("#st-box", { backgroundColor: "rgba(3, 105, 161, 0.12)", duration: 0.8, yoyo: true, repeat: 1 }, 5.5);

  window.__timelines["05-drug-atlas"] = tl;
